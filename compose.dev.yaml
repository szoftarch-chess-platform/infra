# Local development override. It builds the services from the repos cloned into sibling folders,
# and it publishes the ports that a service running on the host needs, reachable only from this machine.

services:
  frontend:
    build: ../frontend

  game-service:
    build: ../game-service

  engine-service:
    build: ../engine-service

  platform-service:
    build: ../platform-service

  # Redis for a game-service that runs on the host.
  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # AMQP for the services that run on the host, and the web management interface.
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
