# Local development override. It builds the services from the repos cloned into sibling folders,
# and it publishes the ports that a service running on the host needs, reachable only from this machine.

services:
  frontend:
    build: ../frontend

  game-service:
    build: ../game-service

  # The engine for a game-service that runs on the host. A port can be published only
  # from a network that is not internal, so the engine joins one that no other container uses.
  engine-service:
    build: ../engine-service
    networks:
      - engine
      - engine-host
    ports:
      - "127.0.0.1:8000:8000"

  platform-service:
    build: ../platform-service

  # The same image as the platform-service, so the build cache serves it.
  platform-migrations:
    build: ../platform-service

  # The database for a platform-service that runs on the host, and for database tools.
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # Redis for a game-service that runs on the host.
  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # AMQP for the services that run on the host, and the web management interface.
  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

networks:
  engine-host:
