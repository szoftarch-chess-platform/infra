# Configuration of RabbitMQ, which ADR-6 decides. RabbitMQ replaces every $(NAME) with the environment
# variable of its container, and it does not start when one of them is missing.

# The default virtual host and the policies of the queues, imported at every start.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

# The users are created only when an empty node starts for the first time. A node that imports
# definitions creates no default user, so the admin user is one of these users too.
default_users.admin.password = $(RABBITMQ_ADMIN_PASSWORD)
default_users.admin.tags = administrator
default_users.admin.vhost_pattern = .*
default_users.admin.configure = .*
default_users.admin.write = .*
default_users.admin.read = .*

# Every service may use only the resources with its own prefix in the default virtual host.
default_users.game-service.password = $(RABBITMQ_GAME_PASSWORD)
default_users.game-service.vhost_pattern = ^/$
default_users.game-service.configure = ^game\.
default_users.game-service.write = ^game\.
default_users.game-service.read = ^game\.

# The platform-service also reads game.events, which it needs to bind its queue.
default_users.platform-service.password = $(RABBITMQ_PLATFORM_PASSWORD)
default_users.platform-service.vhost_pattern = ^/$
default_users.platform-service.configure = ^platform\.
default_users.platform-service.write = ^platform\.
default_users.platform-service.read = ^(platform\..*|game\.events)$
